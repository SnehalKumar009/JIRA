# CI for the tracker (ADR-0015). Branch protection on main requires every job here to pass.
# Actions are pinned by commit SHA; Renovate keeps the SHAs and version comments current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit, integration (Testcontainers: real PostgreSQL and Keycloak) and module-boundary tests.
      - run: ./mvnw -B verify
        working-directory: backend
      # The committed jOOQ classes must match the migrations (ADR-0022).
      - name: Generated jOOQ code is up to date
        run: |
          scripts/generate-jooq.sh
          git diff --exit-code -- backend/src/main/jooq

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  stack:
    name: Full stack (M0 exit criteria)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env with generated secrets
        run: scripts/init-env.sh
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Smoke test (TLS, headers, SPA, Keycloak issuer)
        run: scripts/smoke-test.sh
      # Sign-in, access tokens, back-channel logout, Keycloak disable (up to ~5 min), audit trail.
      - name: Identity (M1 exit criteria)
        run: scripts/test-login.sh
      - name: Data survives down / up
        run: scripts/test-persistence.sh
      - name: Backup -> wipe -> restore
        run: scripts/test-backup-restore.sh --yes
      - name: Memory within limits
        run: scripts/measure-memory.sh
      # Our image must be clean of fixable HIGH/CRITICAL findings.
      - name: Scan app image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: tracker-app:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Third-party image: reported, kept current by Renovate, not a merge blocker.
      - name: Scan Keycloak image (report only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: tracker-keycloak:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
