# Defaults only. Every environment-specific value (database URL, credentials, telemetry endpoints)
# comes from environment variables set by Docker Compose — see .env.example at the repository root.
spring:
  application:
    name: tracker
  datasource:
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  session:
    timeout: 30m
    jdbc:
      # Table comes from Flyway (V2), not from Spring Session.
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  # Trust X-Forwarded-* from Caddy (private network ranges only) so HTTPS is detected correctly.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Caddy sends the public port (8443), needed to build correct OIDC redirect URIs.
      port-header: X-Forwarded-Port
  servlet:
    session:
      timeout: 30m
      cookie:
        # __Host- prefix: browser enforces Secure, Path=/ and no Domain — the cookie can't leak to
        # other hosts or be set over plain HTTP (ADR-0002).
        name: __Host-tracker-session
        secure: true
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  # Separate port that Caddy does not route: health and metrics are reachable only inside Compose.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  info:
    build:
      enabled: true
  observations:
    enable:
      # One span per security filter drowns the useful spans; the request span already covers them.
      spring.security: false
  tracing:
    sampling:
      probability: 1.0
    # Off unless the observability profile is running (see docs/runbooks/observability.md).
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  api-docs:
    # Deliberately public: the API is the product (FEATURES §2, API-first).
    enabled: true
    path: /api/v1/openapi.json
  paths-to-match: /api/**

tracker:
  oidc:
    # issuer, backchannel-url and client-secret come from the environment (compose.yaml).
    client-id: tracker-app
    admin-group: tracker-admins
  rate-limit:
    authenticated-per-minute: 600
    anonymous-per-minute: 120
