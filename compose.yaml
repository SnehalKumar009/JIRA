# Tracker stack — Docker Compose on the desktop (decision 9).
#
#   scripts/init-env.sh                   # once: create .env with generated secrets
#   docker compose up -d --wait           # core stack
#   docker compose --profile observability up -d --wait   # plus Prometheus / Jaeger / Grafana
#
# Every service has a memory limit (ADR-0016) and data lives in named volumes, so
# `docker compose down` / `up` and host reboots lose nothing. Never use `down -v` unless you mean
# to delete all data.

name: tracker

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    <<: *hardening
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run scripts/init-env.sh}
      TRACKER_DB_PASSWORD: ${TRACKER_DB_PASSWORD:?run scripts/init-env.sh}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/init-env.sh}
    volumes:
      # PostgreSQL 18 images keep data under a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker && pg_isready -U postgres -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    stop_grace_period: 30s
    restart: on-failure:5
    logging: *logging

  keycloak:
    build: ./infra/keycloak
    image: tracker-keycloak:${TRACKER_IMAGE_TAG:-local}
    <<: *hardening
    cap_drop: [ALL]
    environment:
      KC_HOSTNAME: https://auth.test:${TRACKER_HTTPS_PORT:-8443}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/init-env.sh}
      KC_DB_POOL_MAX_SIZE: "10"
      # Single node: local caches, no cluster discovery. Saves memory and avoids waiting on stale
      # cluster members recorded in a restored database.
      KC_CACHE: local
      # Temporary admin, used only to bootstrap; the realm itself is configured as code from M1.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?run scripts/init-env.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init-env.sh}
      KC_LOG_CONSOLE_OUTPUT: json
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; speak HTTP to the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    stop_grace_period: 30s
    restart: on-failure:5
    logging: *logging

  app:
    build: .
    image: tracker-app:${TRACKER_IMAGE_TAG:-local}
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracker
      SPRING_DATASOURCE_USERNAME: tracker
      SPRING_DATASOURCE_PASSWORD: ${TRACKER_DB_PASSWORD:?run scripts/init-env.sh}
      MANAGEMENT_TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 768m
    stop_grace_period: 30s
    restart: on-failure:5
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    <<: *hardening
    cap_drop: [ALL]
    # The caddy binary carries this file capability; without it in the bounding set exec is refused.
    cap_add: [NET_BIND_SERVICE]
    environment:
      TRACKER_HTTPS_PORT: ${TRACKER_HTTPS_PORT:-8443}
    ports:
      # Not 443: on this desktop MicroK8s' ingress intercepts 80/443 before Docker sees them.
      - "127.0.0.1:${TRACKER_HTTPS_PORT:-8443}:${TRACKER_HTTPS_PORT:-8443}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the local CA. Deleting it means re-trusting a new root certificate on the desktop.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # Containers resolve the public hostnames to Caddy too, so the browser and the app see the
        # same URLs — required for a consistent OIDC issuer (ADR-0012).
        aliases:
          - tracker.test
          - auth.test
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 64m
    restart: on-failure:5
    logging: *logging

  # ---- Optional: docker compose --profile observability up -d --wait ----------------------------

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    <<: *hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    restart: on-failure:5
    logging: *logging

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    <<: *hardening
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    volumes:
      - ./infra/observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    mem_limit: 192m
    restart: on-failure:5
    logging: *logging

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.12@sha256:28476aa8096cd8d0f658a05a443b605fffb450e57f444335216175d604cfd23d
    <<: *hardening
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init-env.sh}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Not 3000: commonly taken by other local stacks.
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: on-failure:5
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
